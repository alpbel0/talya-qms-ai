# Talya QMS-AI — yerel geliştirme ortamı.
# Kullanım: .env.example dosyasını .env olarak kopyalayın, sonra `docker compose up`.
# Tüm imaj etiketleri sabittir; şifreler .env dosyasından gelir.

services:
  neo4j:
    image: neo4j:5.26.31-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:?.env içinde NEO4J_USER tanımlayın}/${NEO4J_PASSWORD:?.env içinde NEO4J_PASSWORD tanımlayın}
      # APOC ve neosemantics (n10s) eklentileri ilk açılışta imaj tarafından indirilir (internet gerekir).
      NEO4J_PLUGINS: '["apoc", "n10s"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,n10s.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,n10s.*"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  ollama:
    image: ollama/ollama:0.40.10
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU kullanmak için (NVIDIA) aşağıdaki bloğu açın:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_URL: http://ollama:11434
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started

  ui:
    build:
      context: ./ui
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  ollama_models:
